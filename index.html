<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Text Detector</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1b1f24; --muted:#6b7280; --border:#e3e6ea;
    --human:#16a34a; --ai:#dc2626; --accent:#2563eb; --warn:#d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa1ab; --border:#2a2f38; --accent:#3b82f6; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:1.6rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
  textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--border);border-radius:10px;
    padding:12px;background:transparent;color:var(--text);font:inherit}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;flex-wrap:wrap}
  .count{color:var(--muted);font-size:.9rem}
  button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  #go{background:var(--accent);color:#fff}
  #go:disabled{opacity:.55;cursor:not-allowed}
  #clear{background:transparent;color:var(--muted);border:1px solid var(--border);margin-right:8px}
  .msg{margin-top:14px;color:var(--warn);font-size:.95rem}
  .result{margin-top:18px;display:none}
  .verdict{font-size:1.25rem;font-weight:700;margin-bottom:14px}
  .meter{margin:10px 0}
  .meter .label{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:4px}
  .track{height:12px;background:var(--border);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;transition:width .6s ease}
  .fill.human{background:var(--human)} .fill.ai{background:var(--ai)}
  .meta{color:var(--muted);font-size:.85rem;margin-top:12px}
  .note{color:var(--muted);font-size:.8rem;margin-top:22px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Text Detector</h1>
  <p class="sub">Paste text to estimate whether it was written by a human or generated by AI.</p>

  <div class="card">
    <textarea id="text" placeholder="Paste at least ~100 words for a reliable result..."></textarea>
    <div class="row">
      <span class="count" id="count">0 words</span>
      <div>
        <button id="clear" type="button">Clear</button>
        <button id="go" type="button">Analyze</button>
      </div>
    </div>
    <div class="msg" id="msg" hidden></div>

    <div class="result" id="result">
      <div class="verdict" id="verdict"></div>
      <div class="meter">
        <div class="label"><span>Human written</span><span id="humanPct"></span></div>
        <div class="track"><div class="fill human" id="humanFill"></div></div>
      </div>
      <div class="meter">
        <div class="label"><span>AI generated</span><span id="aiPct"></span></div>
        <div class="track"><div class="fill ai" id="aiFill"></div></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <p class="note">Detectors give probabilistic estimates and can be wrong, especially on short, edited, or
  non-native-English text. Don't use a score alone to accuse anyone.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const text = $("text"), go = $("go"), msg = $("msg"), result = $("result");

text.addEventListener("input", () => {
  const n = text.value.trim() ? text.value.trim().split(/\s+/).length : 0;
  $("count").textContent = n + (n === 1 ? " word" : " words");
});

$("clear").addEventListener("click", () => {
  text.value = ""; text.dispatchEvent(new Event("input"));
  msg.hidden = true; result.style.display = "none";
});

go.addEventListener("click", async () => {
  msg.hidden = true; result.style.display = "none";
  go.disabled = true;
  go.innerHTML = '<span class="spinner"></span>Analyzing...';
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text.value})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong");

    $("verdict").textContent = data.verdict;
    $("humanPct").textContent = data.human_pct.toFixed(1) + "%";
    $("aiPct").textContent = data.ai_pct.toFixed(1) + "%";
    $("meta").textContent = `${data.words} words · ${data.chunks} chunk(s) analysed · raw score ${data.raw_score}`;
    result.style.display = "block";
    requestAnimationFrame(() => {
      $("humanFill").style.width = data.human_pct + "%";
      $("aiFill").style.width = data.ai_pct + "%";
    });
  } catch (e) {
    msg.textContent = e.message; msg.hidden = false;
  } finally {
    go.disabled = false; go.textContent = "Analyze";
  }
});
</script>
</body>
</html>
